<title>Taller de impresión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --ground: #eef0ec;
    --panel: #f8f9f6;
    --ink: #1c211f;
    --muted: #5d6762;
    --line: #d3d8d2;
    --accent: #1f7f78;
    --accent-soft: #d4ebe7;
    --stage: #e4e8e3;
    --grid: #c3cac3;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #141816; --panel: #1b201e; --ink: #e7ebe8; --muted: #95a19b;
      --line: #2d3531; --accent: #4fc0b5; --accent-soft: #1d3633;
      --stage: #101412; --grid: #2c3531;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #141816; --panel: #1b201e; --ink: #e7ebe8; --muted: #95a19b;
    --line: #2d3531; --accent: #4fc0b5; --accent-soft: #1d3633;
    --stage: #101412; --grid: #2c3531;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--ground); color: var(--ink);
    font: 15px/1.5 "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-inline: 16px; box-sizing: border-box;
  }
  .app {
    max-width: 1280px; margin: 0 auto; padding-block: 20px;
    display: grid; grid-template-columns: 280px 1fr; gap: 20px;
    min-height: 100%; box-sizing: border-box;
  }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; font-stretch: 78%; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
  h1 span { color: var(--accent); }
  .hint { color: var(--muted); font-size: 13px; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  aside { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item {
    all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 2px;
    padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  }
  .item:hover { border-color: var(--accent); }
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .item[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .item b { font-weight: 650; }
  .item small { color: var(--muted); font-size: 12px; }
  .drop {
    border: 1.5px dashed var(--line); border-radius: 8px; padding: 12px; text-align: center;
    color: var(--muted); font-size: 13px; cursor: pointer;
  }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--ink); }
  .notes { font-size: 13.5px; color: var(--muted); max-width: 65ch; margin: 0; }

  main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .stage {
    position: relative; background: var(--stage); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; min-height: 320px;
  }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .overlay { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; pointer-events: none; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .tools button, .tools select, .tools-select {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }
  .tools button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .tools button:focus-visible, .tools-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .specs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .spec { background: var(--panel); padding: 10px 12px; display: grid; gap: 2px; }
  .spec .v { font-size: 15px; font-weight: 600; }
  .warn { color: #b3541e; }

  .filament { display: grid; gap: 10px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .filament-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button {
    font: inherit; font-size: 13px; color: var(--ink); background: transparent; cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .picked { font-size: 13px; color: var(--muted); }
  .picked b { color: var(--ink); font-weight: 650; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 6px; }
  .sw {
    all: unset; box-sizing: border-box; cursor: pointer; aspect-ratio: 1; border-radius: 50%;
    background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
  }
  .sw.trans { background: linear-gradient(135deg, var(--c) 0 55%, color-mix(in srgb, var(--c) 45%, transparent) 55%); }
  .sw[aria-checked="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
  .sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .field { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); min-width: 0; max-width: 100%; }
  .tools-select { min-width: 0; max-width: 100%; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    aside { order: 2; }
    .specs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stage { aspect-ratio: 1 / 1; }
  }
</style>

<div class="app">
  <header>
    <h1>Taller de <span>impresión</span></h1>
    <div class="hint">Arrastra para girar · rueda o pellizco para acercar · clic derecho para desplazar</div>
  </header>

  <aside>
    <div class="label">Modelos creados</div>
    <div class="list" id="list"></div>
    <label class="drop" id="drop" for="file">Suelta aquí un .stl de tu equipo para verlo
      <input type="file" id="file" accept=".stl" hidden>
    </label>
    <div class="label">Notas</div>
    <p class="notes" id="notes">—</p>
  </aside>

  <main>
    <div class="stage" id="stage">
      <div class="status" id="status">Cargando…</div>
      <div class="overlay mono" id="overlay"></div>
    </div>
    <div class="tools">
      <button type="button" id="spin" aria-pressed="true">Girar solo</button>
      <button type="button" id="wire" aria-pressed="false">Malla</button>
      <button type="button" id="cut" aria-pressed="false">Corte</button>
      <button type="button" id="reset">Vista inicial</button>
    </div>
    <section class="filament" aria-label="Impresora y filamento">
      <div class="filament-head">
        <label class="field" for="bed">Impresora
          <select id="bed" class="tools-select"></select>
        </label>
        <div class="seg" id="mats" role="group" aria-label="Tipo de filamento"></div>
      </div>
      <div class="swatches" id="swatches" role="radiogroup" aria-label="Color del filamento"></div>
      <div class="picked" id="picked"></div>
    </section>
    <div class="specs">
      <div class="spec"><span class="label">Tamaño (mm)</span><span class="v mono" id="s-size">—</span></div>
      <div class="spec"><span class="label">Volumen plástico</span><span class="v mono" id="s-vol">—</span></div>
      <div class="spec"><span class="label" id="s-w-label">Peso</span><span class="v mono" id="s-w">—</span></div>
      <div class="spec"><span class="label">¿Cabe en la cama?</span><span class="v" id="s-fit">—</span></div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);

  // Impresoras Bambu Lab a la venta (volumen útil en mm, un solo nozzle)
  const IMPRESORAS = [
    { id: "a1mini", nombre: "A1 mini", v: [180, 180, 180] },
    { id: "a1", nombre: "A1", v: [256, 256, 256] },
    { id: "a2l", nombre: "A2L", v: [330, 320, 325] },
    { id: "p1s", nombre: "P1S", v: [256, 256, 256] },
    { id: "p2s", nombre: "P2S", v: [256, 256, 256] },
    { id: "x2d", nombre: "X2D", v: [256, 256, 260] },
    { id: "h2s", nombre: "H2S", v: [340, 320, 340] },
    { id: "h2d", nombre: "H2D", v: [325, 320, 325] },
    { id: "h2c", nombre: "H2C", v: [325, 320, 325] },
  ];

  // Colores oficiales (tablas de códigos hex de Bambu Lab)
  const FILAMENTOS = [
    { id: "pla-basic", nombre: "PLA Basic", densidad: 1.26, rugosidad: 0.45, colores: {
      "Jade White": "#FFFFFF", "Beige": "#F7E6DE", "Light Gray": "#D1D3D5", "Silver": "#A6A9AA", "Gray": "#8E9089",
      "Dark Gray": "#545454", "Blue Grey": "#5B6579", "Black": "#000000", "Yellow": "#F4EE2A", "Sunflower Yellow": "#FEC600",
      "Gold": "#E4BD68", "Pumpkin Orange": "#FF9016", "Orange": "#FF6A13", "Red": "#C12E1F", "Maroon Red": "#9D2235",
      "Hot Pink": "#F5547C", "Pink": "#F55A74", "Magenta": "#EC008C", "Purple": "#5E43B7", "Indigo Purple": "#482960",
      "Cobalt Blue": "#0056B8", "Blue": "#0A2989", "Cyan": "#0086D6", "Turquoise": "#00B1B7", "Bright Green": "#BECF00",
      "Bambu Green": "#00AE42", "Mistletoe Green": "#3F8E43", "Bronze": "#847D48", "Brown": "#9D432C", "Cocoa Brown": "#6F5034" } },
    { id: "pla-matte", nombre: "PLA Matte", densidad: 1.32, rugosidad: 0.95, colores: {
      "Ivory White": "#FFFFFF", "Bone White": "#CBC6B8", "Desert Tan": "#E8DBB7", "Latte Brown": "#D3B7A7", "Caramel": "#AE835B",
      "Terracotta": "#B15533", "Dark Brown": "#7D6556", "Dark Chocolate": "#4D3324", "Lemon Yellow": "#F7D959", "Mandarin Orange": "#F99963",
      "Sakura Pink": "#E8AFCF", "Lilac Purple": "#AE96D4", "Plum": "#950051", "Scarlet Red": "#DE4343", "Dark Red": "#BB3D43",
      "Apple Green": "#C2E189", "Grass Green": "#61C680", "Dark Green": "#68724D", "Ice Blue": "#A3D8E1", "Sky Blue": "#56B7E6",
      "Marine Blue": "#0078BF", "Dark Blue": "#042F56", "Ash Gray": "#9B9EA0", "Nardo Gray": "#757575", "Charcoal": "#000000" } },
    { id: "petg-hf", nombre: "PETG HF", densidad: 1.28, rugosidad: 0.22, colores: {
      "White": "#FFFFFF", "Cream": "#F9DFB9", "Gray": "#ADB1B2", "Dark Gray": "#515151", "Black": "#000000",
      "Yellow": "#FFD00B", "Orange": "#F75403", "Red": "#EB3A3A", "Peanut Brown": "#875718", "Lime Green": "#6EE53C",
      "Green": "#00AE42", "Forest Green": "#39541A", "Lake Blue": "#1F79E5", "Blue": "#002E96" } },
    { id: "petg-trans", nombre: "PETG Translucent", densidad: 1.27, rugosidad: 0.15, translucido: true, colores: {
      "Translucent Gray": "#8E8E8E", "Translucent Light Blue": "#61B0FF", "Translucent Teal": "#77EDD7", "Translucent Olive": "#748C45",
      "Translucent Brown": "#C9A381", "Translucent Orange": "#FF911A", "Translucent Pink": "#F9C1BD", "Translucent Purple": "#D6ABFF" } },
  ];
  const guardado = (k, d) => { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  let impresora = IMPRESORAS.find((p) => p.id === guardado("visor-impresora", "p2s")) || IMPRESORAS[4];
  let filamento = FILAMENTOS.find((f) => f.id === guardado("visor-filamento", "petg-hf")) || FILAMENTOS[2];
  let colorNombre = guardado("visor-color", "");
  if (!filamento.colores[colorNombre]) colorNombre = Object.keys(filamento.colores)[0];
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const stage = $("stage"), statusEl = $("status");

  if (!window.THREE || !THREE.STLLoader) { statusEl.textContent = "No se pudo cargar el motor 3D. Recarga la página."; return; }

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  stage.prepend(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
  camera.up.set(0, 0, 1);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.autoRotate = true; controls.autoRotateSpeed = 1.2;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x445048, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(-300, -400, 600); scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.3); rim.position.set(400, 300, 200); scene.add(rim);

  const material = new THREE.MeshStandardMaterial({ metalness: 0.05, roughness: 0.55, side: THREE.DoubleSide });
  const clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
  renderer.localClippingEnabled = true;
  let grupo = null, bedGroup = null, info = null, piezas = null;
  // materiales en uso: el del filamento elegido o uno por pieza de color
  const materiales = () => piezas ? piezas.map((p) => p.material) : [material];

  function applyTheme() {
    scene.background = new THREE.Color(css("--stage"));
    if (bedGroup) buildBed();
  }

  function buildBed() {
    if (bedGroup) scene.remove(bedGroup);
    const [bx, by] = impresora.v;
    bedGroup = new THREE.Group();
    const plate = new THREE.Mesh(new THREE.PlaneGeometry(bx, by),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(css("--panel")), transparent: true, opacity: 0.85 }));
    plate.position.z = -0.3; bedGroup.add(plate);
    const pts = [];
    for (let x = -bx / 2; x <= bx / 2 + 0.01; x += 10) pts.push(x, -by / 2, 0, x, by / 2, 0);
    for (let y = -by / 2; y <= by / 2 + 0.01; y += 10) pts.push(-bx / 2, y, 0, bx / 2, y, 0);
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
    bedGroup.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: new THREE.Color(css("--grid")) })));
    scene.add(bedGroup);
    updateFit();
  }

  function frame() {
    if (!info) return;
    const r = Math.max(info.size.x, info.size.y, info.size.z);
    controls.target.set(0, 0, info.size.z * 0.45);
    camera.position.set(r * 1.6, -r * 2.1, r * 1.35);
    camera.near = r / 100; camera.far = r * 50; camera.updateProjectionMatrix();
    controls.update();
  }

  function stats(geos) {
    let vol = 0, tris = 0;
    const caja = new THREE.Box3();
    geos.forEach((geo) => {
      const p = geo.attributes.position.array; let v = 0;
      for (let i = 0; i < p.length; i += 9) {
        v += (p[i] * (p[i + 4] * p[i + 8] - p[i + 5] * p[i + 7])
            - p[i + 1] * (p[i + 3] * p[i + 8] - p[i + 5] * p[i + 6])
            + p[i + 2] * (p[i + 3] * p[i + 7] - p[i + 4] * p[i + 6])) / 6;
      }
      vol += Math.abs(v); tris += p.length / 9;
      geo.computeBoundingBox(); caja.union(geo.boundingBox);
    });
    const size = new THREE.Vector3(); caja.getSize(size);
    return { vol: vol / 1000, size, tris };
  }

  function updateFit() {
    if (!info) return;
    const [bx, by, bz] = impresora.v;
    const s = info.size;
    const flat = (s.x <= bx && s.y <= by) || (s.x <= by && s.y <= bx);
    const ok = flat && s.z <= bz;
    const el = $("s-fit");
    el.textContent = ok ? "Sí" : (s.z > bz ? `No: ${(s.z - bz).toFixed(0)} mm de más en altura` : "No: demasiado ancho");
    el.className = "v" + (ok ? "" : " warn");
  }

  function updateWeight() {
    $("s-w-label").textContent = "Peso en " + filamento.nombre;
    if (info) $("s-w").textContent = `≈ ${(info.vol * filamento.densidad).toFixed(0)} g`;
  }

  function applyFilament() {
    const hex = filamento.colores[colorNombre];
    const c = new THREE.Color(hex);
    // el negro puro se vería plano: se aclara un poco para leer la forma
    const hsl = {}; c.getHSL(hsl); if (hsl.l < 0.08) c.setHSL(hsl.h, hsl.s, 0.08);
    material.color = c;
    material.roughness = filamento.rugosidad;
    material.transparent = !!filamento.translucido;
    material.opacity = filamento.translucido ? 0.62 : 1;
    material.depthWrite = !filamento.translucido;
    material.needsUpdate = true;
    $("swatches").hidden = !!piezas;
    if (piezas) {  // modelo de varios colores: cada pieza lleva el suyo
      $("picked").textContent = "Varios colores: " + piezas.map((p) => p.nombre).join(" · ");
    } else {
      $("picked").innerHTML = "<b></b> · <span></span> <span class=\"mono\"></span>";
      $("picked").children[0].textContent = filamento.nombre;
      $("picked").children[1].textContent = colorNombre;
      $("picked").children[2].textContent = hex;
    }
    updateWeight();
  }

  function renderFilaments() {
    const mats = $("mats"); mats.textContent = "";
    FILAMENTOS.forEach((f) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = f.nombre; b.setAttribute("aria-pressed", String(f === filamento));
      b.addEventListener("click", () => {
        filamento = f; guardar("visor-filamento", f.id);
        if (!f.colores[colorNombre]) colorNombre = Object.keys(f.colores)[0];
        renderFilaments();
      });
      mats.appendChild(b);
    });
    const sw = $("swatches"); sw.textContent = "";
    Object.entries(filamento.colores).forEach(([nombre, hex]) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "sw" + (filamento.translucido ? " trans" : "");
      b.style.setProperty("--c", hex); b.title = nombre; b.setAttribute("role", "radio");
      b.setAttribute("aria-label", nombre); b.setAttribute("aria-checked", String(nombre === colorNombre));
      b.addEventListener("click", () => { colorNombre = nombre; guardar("visor-color", nombre); renderFilaments(); });
      sw.appendChild(b);
    });
    applyFilament();
  }

  IMPRESORAS.forEach((p) => {
    const o = document.createElement("option");
    o.value = p.id; o.textContent = `Bambu Lab ${p.nombre} · ${p.v.join(" × ")} mm`;
    $("bed").appendChild(o);
  });
  $("bed").value = impresora.id;

  // partes: [{ buffer, color?, nombre? }]; sin color usa el filamento elegido
  function show(partes, meta) {
    const geos = partes.map((p) => new THREE.STLLoader().parse(p.buffer));
    const caja = new THREE.Box3();
    geos.forEach((g) => { g.computeBoundingBox(); caja.union(g.boundingBox); });
    geos.forEach((g) => {
      g.translate(-(caja.min.x + caja.max.x) / 2, -(caja.min.y + caja.max.y) / 2, -caja.min.z);
      g.computeVertexNormals();
    });
    if (grupo) { scene.remove(grupo); grupo.traverse((o) => o.geometry && o.geometry.dispose()); }
    piezas = partes.length > 1 || partes[0].color ? partes.map((p) => {
      const c = new THREE.Color(p.color); const hsl = {}; c.getHSL(hsl);
      if (hsl.l < 0.08) c.setHSL(hsl.h, hsl.s, 0.08);
      return { nombre: p.nombre || p.color, material: new THREE.MeshStandardMaterial({
        color: c, metalness: 0.02, roughness: 0.9, side: THREE.DoubleSide }) };
    }) : null;
    grupo = new THREE.Group();
    geos.forEach((g, i) => grupo.add(new THREE.Mesh(g, piezas ? piezas[i].material : material)));
    scene.add(grupo);
    syncToggles(); applyFilament();
    info = stats(geos);
    const s = info.size;
    $("s-size").textContent = `${s.x.toFixed(0)} × ${s.y.toFixed(0)} × ${s.z.toFixed(0)}`;
    $("s-vol").textContent = `${info.vol.toFixed(0)} cm³`;
    updateWeight();
    $("overlay").textContent = `${meta.nombre} · ${info.tris.toLocaleString("es-ES")} triángulos`;
    $("notes").textContent = meta.notas || "Sin notas.";
    statusEl.hidden = true;
    updateFit(); frame();
  }

  let modelos = [];
  function renderList(activeId) {
    const list = $("list"); list.textContent = "";
    modelos.forEach((m) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "item";
      b.setAttribute("aria-current", String(m.id === activeId));
      b.innerHTML = "<b></b><small></small>";
      b.querySelector("b").textContent = m.nombre;
      b.querySelector("small").textContent = m.fecha || (m.local ? "De tu equipo" : "");
      b.addEventListener("click", () => select(m.id));
      list.appendChild(b);
    });
  }

  async function select(id) {
    const m = modelos.find((x) => x.id === id); if (!m) return;
    renderList(id);
    try { localStorage.setItem("visor-modelo", id); } catch (e) {}
    statusEl.hidden = false; statusEl.textContent = "Cargando " + m.nombre + "…";
    try {
      if (!m.cargadas) {
        // un modelo de una pieza puede traer su color fijo (color + nombreColor)
        const lista = m.buffer ? [{ buffer: m.buffer }]
          : (m.partes || [{ archivo: m.archivo, color: m.color, nombre: m.nombreColor }]);
        m.cargadas = await Promise.all(lista.map(async (p) => {
          if (p.buffer) return p;
          const res = await fetch(p.archivo);
          let buffer;
          if (/\.txt$/i.test(p.archivo)) {  // STL en base64: el servidor no sirve .stl
            const bin = atob((await res.text()).trim());
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            buffer = bytes.buffer;
          } else buffer = await res.arrayBuffer();
          return { buffer, color: p.color, nombre: p.nombre };
        }));
      }
      show(m.cargadas, m);
    } catch (e) { statusEl.textContent = "No se pudo abrir " + m.nombre + "."; }
  }

  function addLocal(file) {
    if (!file || !/\.stl$/i.test(file.name)) { statusEl.hidden = false; statusEl.textContent = "Ese archivo no es un .stl"; return; }
    file.arrayBuffer().then((buf) => {
      const id = "local-" + file.name + "-" + Date.now();
      modelos.push({ id, nombre: file.name.replace(/\.stl$/i, ""), buffer: buf, local: true, notas: "Archivo abierto desde tu equipo; solo lo ves tú." });
      select(id);
    });
  }
  $("file").addEventListener("change", (e) => addLocal(e.target.files[0]));
  const drop = $("drop");
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => addLocal(e.dataTransfer.files[0]));

  const toggle = (id, fn) => $(id).addEventListener("click", (e) => {
    const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
    e.currentTarget.setAttribute("aria-pressed", String(on)); fn(on);
  });
  toggle("spin", (on) => { controls.autoRotate = on; });
  function syncToggles() {
    const malla = $("wire").getAttribute("aria-pressed") === "true";
    const corte = $("cut").getAttribute("aria-pressed") === "true";
    materiales().forEach((m) => { m.wireframe = malla; m.clippingPlanes = corte ? [clip] : []; m.needsUpdate = true; });
  }
  toggle("wire", syncToggles);
  toggle("cut", syncToggles);
  $("reset").addEventListener("click", frame);
  $("bed").addEventListener("change", (e) => {
    impresora = IMPRESORAS.find((p) => p.id === e.target.value); guardar("visor-impresora", impresora.id); buildBed();
  });
  controls.addEventListener("start", () => { controls.autoRotate = false; $("spin").setAttribute("aria-pressed", "false"); });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { controls.autoRotate = false; $("spin").setAttribute("aria-pressed", "false"); }

  applyTheme(); renderFilaments(); buildBed(); resize();
  (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

  fetch("modelos.json").then((r) => r.json()).then((list) => {
    modelos = list;
    let saved = null; try { saved = localStorage.getItem("visor-modelo"); } catch (e) {}
    const first = modelos.find((m) => m.id === saved) || modelos[modelos.length - 1];
    if (first) select(first.id); else { renderList(); statusEl.textContent = "Todavía no hay modelos."; }
  }).catch(() => { statusEl.textContent = "No se pudo leer la lista de modelos."; });
})();
</script>
